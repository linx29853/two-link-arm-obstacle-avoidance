[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armlab-planning-control"
version = "0.0.0"
description = "Learning scaffold for planar arm planning and control"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
plot = ["matplotlib>=3.8"]
sim = ["mujoco>=3.2,<4"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["RRT_Connect", "_validation", "astar", "edge_check", "forward_kinematics", "inverse_jacobian", "inverse_kinematics", "is_pose_valid", "jacobian", "pd_control", "pd_tracking", "simple_check", "trajectory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
